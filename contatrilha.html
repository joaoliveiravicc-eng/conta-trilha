<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContaTrilha — Contabilidade do zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF2EA; --card:#FFFFFF; --soft:#F5F8F3; --ink:#1C3D5A; --ink2:#3E5A6E;
  --text:#22302C; --muted:#5B6B63; --gold:#C99A2E; --gold2:#A87E1F; --goldp:#F6EBCB;
  --green:#1E8A4C; --green2:#166B3B; --greenp:#DCEFE1; --red:#B3432B; --red2:#8E3321; --redp:#F6E1DA;
  --line:#D6DFD2; --shadow:rgba(28,61,90,.12);
  --fd:'Roboto Slab', Georgia, 'Times New Roman', serif;
  --fb:'Lexend', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1713; --card:#18231F; --soft:#1D2A25; --ink:#CFE0EC; --ink2:#9FB6C4;
    --text:#E7ECE7; --muted:#9EB0A6; --gold:#E0B750; --gold2:#E0B750; --goldp:#3A3120;
    --green:#3FBE79; --green2:#2E9A60; --greenp:#1B3326; --red:#E2735A; --red2:#B85843; --redp:#3A231E;
    --line:#2A3830; --shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#0F1713; --card:#18231F; --soft:#1D2A25; --ink:#CFE0EC; --ink2:#9FB6C4;
  --text:#E7ECE7; --muted:#9EB0A6; --gold:#E0B750; --gold2:#E0B750; --goldp:#3A3120;
  --green:#3FBE79; --green2:#2E9A60; --greenp:#1B3326; --red:#E2735A; --red2:#B85843; --redp:#3A231E;
  --line:#2A3830; --shadow:rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper);}
html,body{height:100%;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0; background:var(--paper); color:var(--text); font-family:var(--fb); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;}
button{font:inherit; color:inherit; cursor:pointer;}
button:disabled{cursor:default;}
textarea{font:inherit;}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px;}
b{font-weight:600;}
#app{max-width:520px; margin:0 auto; min-height:100%; position:relative;}
.screen{display:none;}
.screen.active{display:block;}
body.has-nav .screen{padding-bottom:96px;}
h1,h2,h3{font-family:var(--fd); color:var(--ink); line-height:1.25; margin:0;}

/* ---------- top bar ---------- */
#topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--paper); display:flex; align-items:center; justify-content:space-between; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line);}
.brand{display:flex; align-items:center; gap:8px; font-family:var(--fd); font-weight:800; color:var(--ink); font-size:1.02rem; flex:none;}
.mark{width:30px; height:30px; border-radius:9px; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:1rem; flex:none;}
.stats{display:flex; gap:6px;}
.pill{display:flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line); padding:5px 9px; border-radius:999px; font-weight:700; font-size:.82rem; font-variant-numeric:tabular-nums; white-space:nowrap;}
.pill.fire{color:var(--red);} .pill.xp{color:var(--gold2);}
.pill.dim{color:var(--muted);}

/* ---------- bottom nav ---------- */
#bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; z-index:40; background:var(--card); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,1fr); padding:5px 2px calc(5px + env(safe-area-inset-bottom,0px));}
#bottomnav[hidden]{display:none;}
#bottomnav button{border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:1px; padding:5px 0; border-radius:12px; color:var(--muted); font-size:.63rem; font-weight:600;}
#bottomnav button .ni{font-size:1.25rem; line-height:1; filter:grayscale(1); opacity:.7;}
#bottomnav button.on{color:var(--ink); background:var(--soft);}
#bottomnav button.on .ni{filter:none; opacity:1;}

/* ---------- common ---------- */
.pad{padding:18px 16px;}
.sec-h{font-family:var(--fd); font-size:1.1rem; color:var(--ink); margin:22px 16px 10px;}
.btn{display:block; width:100%; padding:14px 16px; border-radius:14px; border:none; font-weight:700; font-size:1rem; letter-spacing:.01em; text-align:center;}
.btn:active:not(:disabled){transform:translateY(2px);}
.btn.primary{background:var(--green); color:#fff; box-shadow:0 4px 0 var(--green2);}
.btn.primary:disabled{background:var(--line); color:var(--muted); box-shadow:0 4px 0 var(--line);}
.btn.danger{background:var(--red); color:#fff; box-shadow:0 4px 0 var(--red2);}
.btn.dark{background:var(--ink); color:var(--paper); box-shadow:0 4px 0 var(--ink2);}
.btn.ghost{background:transparent; border:2px solid var(--line); color:var(--ink); box-shadow:0 3px 0 var(--line);}
.btn + .btn{margin-top:12px;}
.row{display:flex; gap:10px;} .row .btn{margin:0;}
.link{background:none; border:none; color:var(--ink2); font-weight:600; font-size:.9rem; padding:6px 8px; text-decoration:underline; text-underline-offset:3px;}
.icon-btn{width:38px; height:38px; border-radius:11px; border:1px solid var(--line); background:var(--card); display:grid; place-items:center; color:var(--ink); font-size:1.05rem; flex:none;}
.progress-track{height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:var(--cc,var(--green)); border-radius:99px; transition:width .45s ease;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;}
.muted{color:var(--muted);}
.small{font-size:.84rem;}

/* ---------- Bento, o castor ---------- */
.bento-wrap{flex:none; filter:drop-shadow(0 4px 6px var(--shadow));}
svg.bento{display:block; width:100%; height:100%;}
.bento-wrap.xs{width:46px; height:50px;}
.bento-wrap.sm{width:58px; height:64px;}
.bento-wrap.md{width:100px; height:110px; margin:0 auto 8px;}
.bento-wrap.lg{width:150px; height:165px; margin:0 auto;}
.bento-wrap.xl{width:130px; height:143px; margin:0 auto 14px;}
.bento-wrap.center-b{display:block;}
.bento-row{display:flex; align-items:flex-end; gap:10px; padding:14px 16px 4px;}
.bento-row.tight{padding:0 0 10px; align-items:center;}
.speech{position:relative; flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 13px; font-size:.87rem; line-height:1.4; color:var(--text); margin-bottom:6px;}
.speech::before{content:""; position:absolute; left:-7px; bottom:12px; width:12px; height:12px; background:var(--card); border-left:1px solid var(--line); border-bottom:1px solid var(--line); transform:rotate(45deg);}
.speech.sm{font-size:.85rem; margin-bottom:0;}
.bento.idle{animation:bfloat 3.2s ease-in-out infinite;}
.bento.happy,.bento.cheer{animation:bbounce .5s ease;}
.bento.sad{animation:bshake .4s ease;}
@keyframes bfloat{0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)}}
@keyframes bbounce{0%{transform:scale(1)} 30%{transform:scale(1.12)} 60%{transform:scale(.96)} 100%{transform:scale(1)}}
@keyframes bshake{20%{transform:translateX(-4px) rotate(-2deg)} 60%{transform:translateX(4px) rotate(2deg)} 100%{transform:translateX(0) rotate(0)}}

/* ---------- home ---------- */
.goal-row{display:flex; align-items:center; gap:14px; padding:6px 16px 4px;}
.ring{flex:none;}
.goal-t{font-weight:700; color:var(--text);}
.goal-s{font-size:.86rem; color:var(--muted); font-variant-numeric:tabular-nums;}
.continue{display:block; width:calc(100% - 32px); margin:14px 16px 0; text-align:left; border:none; border-radius:20px; padding:18px; background:var(--cc); color:#fff; box-shadow:0 6px 0 color-mix(in srgb, var(--cc) 70%, #000); position:relative; overflow:hidden;}
.continue::before{content:""; position:absolute; right:-30px; top:-30px; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.1);}
.continue .k{font-size:.8rem; font-weight:600; opacity:.9;}
.continue .t{font-family:var(--fd); font-size:1.3rem; font-weight:800; margin:4px 0 2px; line-height:1.2; max-width:85%;}
.continue .s{font-size:.83rem; opacity:.9;}
.continue .play{position:absolute; right:16px; bottom:16px; width:46px; height:46px; border-radius:50%; background:#fff; color:var(--cc); display:grid; place-items:center; font-size:1.1rem;}
.continue:active{transform:translateY(3px); box-shadow:0 3px 0 color-mix(in srgb, var(--cc) 70%, #000);}
.continue.alldone{background:var(--ink); --cc:var(--ink);}
.miss-card{margin:16px; padding:14px 14px 12px;}
.miss-h{display:flex; align-items:center; gap:8px; font-weight:800; color:var(--ink); margin-bottom:10px; font-size:.98rem;}
.miss-badge{background:var(--red); color:#fff; font-size:.72rem; border-radius:99px; min-width:20px; height:20px; padding:0 6px; display:grid; place-items:center;}
.miss-row{display:flex; align-items:center; gap:10px; padding:7px 0;}
.miss-row.claimed{opacity:.5;}
.miss-row .mi{font-size:1.3rem; flex:none;}
.mtxt{flex:1; min-width:0;}
.mt{font-size:.84rem; font-weight:600;}
.mbar{height:6px; background:var(--line); border-radius:99px; margin-top:5px; overflow:hidden;}
.mbar > div{height:100%; background:var(--gold); border-radius:99px;}
.mnum{font-size:.76rem; color:var(--muted); font-variant-numeric:tabular-nums; flex:none;}
.mclaim{flex:none; background:var(--gold); color:#fff; border:none; border-radius:10px; padding:6px 10px; font-weight:800; font-size:.78rem; box-shadow:0 3px 0 var(--gold2);}
.mchk{color:var(--green); font-weight:800; flex:none;}
.chest-btn{width:100%; margin-top:8px; background:var(--goldp); color:var(--gold2); border:2px dashed var(--gold); border-radius:12px; padding:10px; font-weight:700; font-size:.85rem;}
.course-list{display:flex; flex-direction:column; gap:10px; padding:0 16px;}
.crow{display:flex; align-items:center; gap:13px; text-align:left; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px; box-shadow:0 2px 0 var(--line);}
.crow:active{transform:translateY(1px);}
.crow .badge{width:50px; height:50px; border-radius:14px; background:var(--cc); display:grid; place-items:center; font-size:1.5rem; flex:none; position:relative;}
.crow .badge .num{position:absolute; bottom:-5px; right:-5px; background:var(--card); color:var(--ink); border:2px solid var(--cc); border-radius:99px; font-size:.68rem; font-weight:700; min-width:22px; height:22px; display:grid; place-items:center;}
.crow .ci{flex:1; min-width:0;}
.crow .ct{font-weight:700; font-size:.98rem; color:var(--text);}
.crow .cs{font-size:.78rem; color:var(--muted); margin:2px 0 8px; line-height:1.35;}
.crow .cm{font-size:.74rem; color:var(--muted); margin-top:5px; display:flex; justify-content:space-between; font-variant-numeric:tabular-nums;}
.crow.locked .badge{background:var(--line); filter:grayscale(1);}
.crow.locked .ct{color:var(--muted);}
.crow .chev{color:var(--muted); font-size:1.3rem;}

/* ---------- path ---------- */
.path-top{display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:env(safe-area-inset-top,0px); z-index:25; background:var(--paper); border-bottom:1px solid var(--line);}
.path-top .pk{font-size:.76rem; color:var(--muted); font-weight:600;}
.path-top h2{font-size:1.1rem;}
.banner{margin:16px 16px 4px; padding:16px; border-radius:18px; background:var(--cc); color:#fff;}
.banner p{margin:0 0 12px; font-size:.9rem; line-height:1.45; opacity:.95;}
.banner .progress-track{background:rgba(255,255,255,.25);}
.banner .progress-fill{background:#fff;}
.banner .bm{font-size:.78rem; margin-top:6px; opacity:.9; font-variant-numeric:tabular-nums;}
.path{position:relative; padding:30px 0 40px; display:flex; flex-direction:column; align-items:center; gap:28px;
  background-image:repeating-linear-gradient(to bottom, transparent 0, transparent 37px, var(--line) 37px, var(--line) 38px);}
.unit-head{width:calc(100% - 56px); margin:6px 0 4px; text-align:center; background:var(--cc); color:#fff; border-radius:12px; padding:9px 14px; font-weight:700; font-size:.86rem;}
.nwrap{display:flex; flex-direction:column; align-items:center; gap:8px; position:relative;}
.node{width:74px; height:70px; border-radius:50%; border:none; display:grid; place-items:center; font-size:1.55rem; position:relative;}
.node.cur{background:var(--cc); color:#fff; box-shadow:0 7px 0 color-mix(in srgb, var(--cc) 65%, #000);}
.node.done{background:var(--gold); color:#fff; box-shadow:0 7px 0 var(--gold2);}
.node.locked{background:var(--soft); color:var(--muted); box-shadow:0 7px 0 var(--line); border:2px solid var(--line);}
.node.final{border-radius:22px;}
.node.final.trophy{background:var(--gold); box-shadow:0 7px 0 var(--gold2);}
.node:active:not(.locked){transform:translateY(4px); box-shadow:0 3px 0 color-mix(in srgb, var(--cc) 65%, #000);}
.node.cur::after{content:""; position:absolute; inset:-9px; border-radius:50%; border:3px solid var(--cc); opacity:.35; animation:pulse 1.8s ease-out infinite;}
@keyframes pulse{0%{transform:scale(.92); opacity:.5} 100%{transform:scale(1.18); opacity:0}}
.bubble{position:absolute; top:-38px; background:var(--card); color:var(--cc); border:2px solid var(--line); font-weight:700; font-size:.78rem; padding:4px 11px; border-radius:10px; white-space:nowrap; animation:bob 1.6s ease-in-out infinite;}
.bubble::after{content:""; position:absolute; left:50%; bottom:-7px; width:10px; height:10px; background:var(--card); border-right:2px solid var(--line); border-bottom:2px solid var(--line); transform:translateX(-50%) rotate(45deg);}
@keyframes bob{50%{transform:translateY(-4px)}}
.ntitle{font-size:.75rem; font-weight:600; color:var(--muted); text-align:center; max-width:126px; line-height:1.3; background:var(--paper); padding:0 4px;}
.nwrap.is-cur .ntitle{color:var(--text);}

/* ---------- learn ---------- */
.ltop,.qtop{position:sticky; top:env(safe-area-inset-top,0px); z-index:25; background:var(--paper); display:flex; align-items:center; gap:12px; padding:12px 16px;}
.dots{flex:1; display:flex; gap:6px;}
.dots span{flex:1; height:6px; border-radius:9px; background:var(--line);}
.dots span.on{background:var(--cc);}
.lbody{padding:6px 18px 180px;}
.lk{font-size:.8rem; color:var(--muted); font-weight:600; margin-bottom:2px;}
.lbody h2{font-size:1.4rem; margin-bottom:14px;}
.lc{font-size:1rem; line-height:1.6;}
.lc p{margin:0 0 12px;}
.foot{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:520px; z-index:35; background:var(--paper); border-top:2px solid var(--line); padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px)); transition:background .2s;}
.foot .btn{margin:0;}
.foot .row .btn.ghost{flex:0 0 34%;}
.foot.ok{background:var(--greenp); border-top-color:transparent;}
.foot.bad{background:var(--redp); border-top-color:transparent;}
.fb{display:none; margin-bottom:12px;}
.foot.ok .fb,.foot.bad .fb{display:block;}
.fb-t{font-weight:700; font-size:1.05rem; display:flex; align-items:center; gap:8px;}
.foot.ok .fb-t{color:var(--green2);}
.foot.bad .fb-t{color:var(--red);}
:root[data-theme="dark"] .foot.ok .fb-t{color:var(--green);}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .foot.ok .fb-t{color:var(--green);} }
.fb-b{font-size:.9rem; line-height:1.45; margin-top:4px; color:var(--text); max-height:30vh; overflow:auto;}
.fb-ans{font-weight:600; margin-bottom:4px;}
.foot.ok .btn.primary{background:var(--green);}
.foot.bad .btn.primary{background:var(--red); box-shadow:0 4px 0 var(--red2);}

/* content components (theory cards) */
.callout{border-radius:14px; padding:12px 14px; margin:14px 0; border:1px solid var(--line); background:var(--card);}
.callout .cl-h{font-weight:700; font-size:.84rem; margin-bottom:4px;}
.callout .cl-b{font-size:.93rem; line-height:1.5;}
.callout.dica{border-left:5px solid var(--gold);}
.callout.exemplo{border-left:5px solid var(--ink2);}
.callout.atencao{border-left:5px solid var(--red);}
.callout.regra{border-left:5px solid var(--green); background:var(--greenp);}
.eqn{font-family:var(--fd); font-weight:700; color:var(--ink); background:var(--card); border:2px dashed var(--line); border-radius:14px; text-align:center; padding:14px 12px; margin:12px 0 14px; font-size:1.03rem; line-height:1.4;}
.tblwrap{overflow-x:auto; margin:10px 0 14px; border:1px solid var(--line); border-radius:12px; background:var(--card);}
table{border-collapse:collapse; width:100%; font-size:.85rem;}
th,td{padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
th{background:var(--soft); color:var(--ink); font-weight:700; font-size:.78rem;}
tr:last-child td{border-bottom:none;}
.blist{padding-left:20px; margin:0 0 12px;}
.blist li{margin-bottom:6px;}
.steps{counter-reset:s; list-style:none; padding:0; margin:0 0 12px;}
.steps li{counter-increment:s; position:relative; padding:6px 0 6px 40px; margin-bottom:4px;}
.steps li::before{content:counter(s); position:absolute; left:0; top:4px; width:28px; height:28px; border-radius:50%; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-weight:700; font-size:.85rem;}
.tgroup{display:flex; gap:12px; flex-wrap:wrap; margin:10px 0;}
.tgroup .tacct{flex:1; min-width:130px; margin:0;}
.tacct{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:10px 0 14px; max-width:320px; font-variant-numeric:tabular-nums;}
.tname{text-align:center; font-weight:700; font-family:var(--fd); color:var(--ink); padding-bottom:6px; border-bottom:3px solid var(--ink);}
.tdc{display:grid; grid-template-columns:1fr 1fr; font-size:.68rem; color:var(--muted); font-weight:600; padding:3px 0;}
.tdc span:first-child{padding-right:8px;} .tdc span:last-child{padding-left:10px;}
.tbody2,.tbody{display:grid; grid-template-columns:1fr 1fr;}
.tcol{padding:4px 0; min-height:28px;}
.tcol:first-child{border-right:3px solid var(--ink); padding-right:10px; text-align:right;}
.tcol:last-child{padding-left:10px;}
.tsaldo{border-top:1px solid var(--line); margin-top:4px; padding-top:6px; font-size:.84rem; font-weight:700; color:var(--green2); text-align:center;}
.lanc{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:8px 12px; margin:10px 0 14px; font-variant-numeric:tabular-nums;}
.ln{display:flex; gap:10px; padding:4px 0; align-items:baseline;}
.ln .dc{width:22px; height:22px; flex:none; border-radius:6px; display:grid; place-items:center; font-size:.74rem; font-weight:700; color:#fff;}
.ln.d .dc{background:var(--ink);}
.ln.c{padding-left:22px;}
.ln.c .dc{background:var(--gold2);}
.ln .acc{flex:1;}
.ln .val{font-weight:600;}

/* ---------- quiz ---------- */
.hearts,.hi{display:flex; align-items:center; gap:4px; font-weight:700; color:var(--red); font-variant-numeric:tabular-nums; flex:none;}
#q-hearts{display:flex; align-items:center; gap:4px; font-weight:700; color:var(--red); font-variant-numeric:tabular-nums; flex:none;}
.qbar{flex:1; height:14px; background:var(--line); border-radius:99px; overflow:hidden;}
#q-bar{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .35s ease;}
.qbody{padding:12px 18px 240px;}
.qk{font-size:.8rem; font-weight:700; color:var(--ink2); margin-bottom:6px; display:flex; align-items:center; gap:6px;}
.qk .tagnew{background:var(--goldp); color:var(--gold2); border-radius:6px; padding:1px 7px; font-size:.72rem;}
.qq{font-family:var(--fd); font-size:1.2rem; line-height:1.4; color:var(--text); margin:0 0 18px; font-weight:700;}
.qq.state{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px; font-weight:600;}
.hint{font-size:.82rem; color:var(--muted); margin:12px 0 10px;}
.hintrow{margin:8px 0 4px;}
.hintbtn{background:var(--goldp); color:var(--gold2); border-radius:10px; text-decoration:none; padding:7px 12px; font-size:.82rem;}
.hintbox{display:none; background:var(--card); border:2px dashed var(--gold); border-radius:12px; padding:10px 12px; margin-top:6px; font-size:.88rem; line-height:1.4;}
.hintbox.show{display:block;}
.options{display:flex; flex-direction:column; gap:10px;}
.opt{display:flex; gap:12px; align-items:center; text-align:left; width:100%; padding:13px 14px; border-radius:14px; border:2px solid var(--line); background:var(--card); box-shadow:0 3px 0 var(--line); font-size:.97rem; line-height:1.4;}
.opt .okey{flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--line); display:grid; place-items:center; font-size:.76rem; font-weight:700; color:var(--muted);}
.opt.sel{border-color:var(--ink2); background:var(--soft); box-shadow:0 3px 0 var(--ink2);}
.opt.sel .okey{border-color:var(--ink2); color:var(--ink);}
.opt.right{border-color:var(--green); background:var(--greenp); box-shadow:0 3px 0 var(--green);}
.opt.wrong{border-color:var(--red); background:var(--redp); box-shadow:0 3px 0 var(--red);}
.opt:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.tfrow{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.tfrow .opt{justify-content:center; font-weight:700; padding:18px 10px; font-size:1.02rem;}
.tfrow .opt .okey{display:none;}
.fill-sent{font-size:1.08rem; line-height:2.3; margin-bottom:20px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 16px;}
.blank{display:inline-block; min-width:96px; min-height:36px; vertical-align:middle; margin:0 3px; border:none; border-bottom:3px solid var(--ink2); background:var(--soft); border-radius:8px 8px 0 0; padding:2px 10px; font-weight:600; font-size:.98rem; line-height:1.6;}
.blank.filled{background:var(--card); border:2px solid var(--line); border-bottom-width:4px; border-radius:10px;}
.blank.right{border-color:var(--green); background:var(--greenp);}
.blank.wrong{border-color:var(--red); background:var(--redp);}
.chipbank{display:flex; flex-wrap:wrap; gap:9px;}
.chip{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:9px 13px; font-size:.92rem; font-weight:500; box-shadow:0 3px 0 var(--line); display:inline-flex; align-items:center; gap:7px;}
.chip.used{visibility:hidden;}
.chip:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--line);}
.chip .tag{display:none; width:22px; height:22px; border-radius:6px; place-items:center; font-size:.74rem; font-weight:700; color:#fff;}
.chip[data-s="1"]{border-color:var(--ink); background:var(--soft);}
.chip[data-s="1"] .tag{display:grid; background:var(--ink);}
.chip[data-s="2"]{border-color:var(--gold2); background:var(--goldp);}
.chip[data-s="2"] .tag{display:grid; background:var(--gold2);}
.chip.right{border-color:var(--green) !important; background:var(--greenp) !important;}
.chip.wrong{border-color:var(--red) !important; background:var(--redp) !important;}
.chip.miss{border-style:dashed !important; border-color:var(--green) !important;}
.lanc.live{min-height:62px; border:2px dashed var(--line);}
.lanc-empty{color:var(--muted); font-size:.88rem; padding:10px 0; text-align:center;}
.mgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.mcol{display:flex; flex-direction:column; gap:10px;}
.mbtn{width:100%; min-height:58px; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:10px; font-size:.87rem; line-height:1.3; box-shadow:0 3px 0 var(--line); text-align:center;}
.mbtn.sel{border-color:var(--ink2); background:var(--soft); box-shadow:0 3px 0 var(--ink2);}
.mbtn.done{border-color:var(--green); background:var(--greenp); color:var(--green2); opacity:.55; box-shadow:none;}
.mbtn.no{border-color:var(--red); background:var(--redp); animation:shake .35s;}
@keyframes shake{25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}
.crow2{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:11px 12px; margin-bottom:10px;}
.crow2 .cl{font-weight:600; font-size:.95rem; margin-bottom:8px;}
.seg{display:flex; flex-wrap:wrap; gap:6px;}
.seg button{border:2px solid var(--line); background:var(--soft); border-radius:10px; padding:6px 10px; font-size:.8rem; font-weight:600; color:var(--muted);}
.seg button.on{border-color:var(--ink2); background:var(--ink); color:var(--paper);}
.seg button.right{border-color:var(--green); background:var(--green); color:#fff;}
.seg button.wrong{border-color:var(--red); background:var(--red); color:#fff;}
.seg.tsseg button{flex:1; padding:12px 6px; font-size:.9rem;}
.crow2.r{border-color:var(--green);} .crow2.w{border-color:var(--red);}
.numwrap{display:flex; align-items:center; gap:10px; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:6px 16px; box-shadow:0 3px 0 var(--line); margin-bottom:10px;}
.numwrap:focus-within{border-color:var(--ink2);}
.numwrap span{font-weight:700; color:var(--muted); font-size:1.05rem;}
.numwrap input{flex:1; min-width:0; border:none; background:transparent; color:var(--text); font:inherit; font-size:1.35rem; font-weight:600; padding:10px 0; outline:none; font-variant-numeric:tabular-nums;}
.numwrap.wide input{font-size:1.05rem; font-weight:500;}
.numwrap.right{border-color:var(--green); background:var(--greenp);}
.numwrap.wrong{border-color:var(--red); background:var(--redp);}
.ewrow{margin-bottom:4px;}
.ewlabel{font-size:.8rem; font-weight:700; color:var(--ink2); margin-bottom:4px;}
.ewans{font-size:.82rem; color:var(--green2); font-weight:600; margin:-4px 0 10px;}
.ordstrip{background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:6px 10px; margin-bottom:14px;}
.ordstrip.locked{border-style:solid;}
.ordstrip.right{border-color:var(--green);}
.ordstrip.wrong{border-color:var(--red);}
.ordslot{display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:.92rem;}
.ordslot:last-child{border-bottom:none;}
.ordslot .on{width:24px; height:24px; border-radius:7px; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:.76rem; font-weight:700; flex:none;}
.ordslot.right .on{background:var(--green);}
.explta{width:100%; border:2px solid var(--line); border-radius:14px; background:var(--card); color:var(--text); padding:12px 14px; font-size:.95rem; line-height:1.5; resize:vertical; outline:none;}
.explta:focus{border-color:var(--ink2);}
.explcheck{margin-top:6px;}
.explist{list-style:none; padding:0; margin:0 0 10px;}
.explist li{padding:4px 0; font-size:.88rem;}
.explist li.hit{color:var(--green2);}
.explist li.miss{color:var(--muted);}
.modelans{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:.88rem; line-height:1.45;}

/* ---------- result / fail ---------- */
.center{text-align:center; padding:36px 22px 180px;}
.center h1{font-size:1.6rem; margin-bottom:6px;}
.center .sub{color:var(--muted); margin:0 0 22px;}
.rstats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px;}
.rs{border-radius:14px; border:2px solid var(--cc,var(--line)); overflow:hidden; background:var(--card);}
.rs .rl{background:var(--cc,var(--ink)); color:#fff; font-size:.7rem; font-weight:700; padding:4px 2px;}
.rs .rv{font-family:var(--fd); font-weight:800; font-size:1.25rem; padding:10px 2px; color:var(--text); font-variant-numeric:tabular-nums;}
.note{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; text-align:left; display:flex; gap:12px; align-items:center; font-size:.9rem;}
.note .ne{font-size:1.5rem;}

/* ---------- practice / cases ---------- */
.pcard{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 3px 0 var(--line); margin-bottom:12px;}
.pcard:disabled{opacity:.5;}
.pcard .pe{width:52px; height:52px; border-radius:14px; display:grid; place-items:center; font-size:1.5rem; background:var(--soft); flex:none;}
.pcard .pt{font-weight:700;}
.pcard .ps{font-size:.83rem; color:var(--muted); line-height:1.4;}
.pcard .cnt{margin-left:auto; background:var(--red); color:#fff; border-radius:99px; min-width:28px; height:28px; display:grid; place-items:center; font-weight:700; font-size:.82rem; padding:0 8px;}
.trow{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:.92rem;}
.trow:last-child{border-bottom:none;}
.trow .tr-i{font-size:1.3rem;}
.trow .tr-s{margin-left:auto; font-size:.8rem; color:var(--muted);}

/* ---------- blitz ---------- */
.bz-time{flex:none; font-family:var(--fd); font-weight:800; font-size:1.3rem; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:12px; padding:4px 14px;}
.bz-time.low{color:var(--red); border-color:var(--red); animation:bbounce .5s ease infinite;}
.bz-score{flex:1; text-align:right; font-weight:800; color:var(--gold2); font-size:1.05rem;}

/* ---------- shop ---------- */
.shop-preview{display:flex; justify-content:center; padding:8px 0 4px;}
.shop-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.shop-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; text-align:center;}
.sc-prev{width:100%; height:78px;}
.sc-n{font-size:.82rem; font-weight:700; margin:4px 0 8px; line-height:1.25;}
.seqbtn{width:100%; padding:8px; border-radius:10px; border:none; background:var(--gold); color:#fff; font-weight:800; font-size:.8rem; box-shadow:0 3px 0 var(--gold2);}
.seqbtn.on{background:var(--green); box-shadow:0 3px 0 var(--green2);}
.seqbtn.buy:disabled{background:var(--line); color:var(--muted); box-shadow:none;}

/* ---------- glossary ---------- */
.search{position:sticky; top:calc(env(safe-area-inset-top,0px) + 63px); z-index:20; background:var(--paper); padding:12px 16px;}
.search input{width:100%; border:2px solid var(--line); background:var(--card); color:var(--text); border-radius:14px; padding:12px 14px; font:inherit; font-size:1rem; outline:none;}
.search input:focus{border-color:var(--ink2);}
.gl{padding:0 16px;}
.gi{padding:12px 0; border-bottom:1px solid var(--line);}
.gi dt{font-weight:700; color:var(--ink); font-family:var(--fd);}
.gi dd{margin:3px 0 0; font-size:.9rem; color:var(--text); line-height:1.5;}
.gl-empty{padding:30px 16px; text-align:center; color:var(--muted);}

/* ---------- profile ---------- */
.lvl{margin:16px; padding:18px; border-radius:20px; background:var(--ink); color:var(--paper);}
.lvl .lk2{font-size:.8rem; opacity:.8;}
.lvl .ln2{font-family:var(--fd); font-size:1.4rem; font-weight:800; margin:2px 0 12px;}
.lvl .progress-track{background:rgba(255,255,255,.2);}
.lvl .progress-fill{background:var(--gold);}
.lvl .lm{font-size:.78rem; opacity:.85; margin-top:6px; font-variant-numeric:tabular-nums;}
.sgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px;}
.sbox{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; display:flex; gap:10px; align-items:center;}
.sbox .se{font-size:1.4rem;}
.sbox .sv{font-family:var(--fd); font-weight:800; font-size:1.1rem; line-height:1.1; font-variant-numeric:tabular-nums;}
.sbox .sl{font-size:.73rem; color:var(--muted);}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:150px; padding:10px 16px 0;}
.wb{display:flex; flex-direction:column; align-items:center; gap:4px; height:100%;}
.wb-bar{flex:1; width:100%; max-width:32px; background:var(--soft); border-radius:8px; display:flex; align-items:flex-end; overflow:hidden; border:1px solid var(--line);}
.wb-bar > div{width:100%; background:var(--ink2); border-radius:6px 6px 0 0; min-height:0;}
.wb-bar > div.hit{background:var(--gold);}
.wb-v{font-size:.66rem; color:var(--muted); height:14px; font-variant-numeric:tabular-nums;}
.wb-l{font-size:.71rem; font-weight:600; color:var(--muted); text-transform:capitalize;}
.wb.today .wb-l{color:var(--ink);}
.bgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; padding:0 16px;}
.bd{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 6px; text-align:center;}
.bd .bi{font-size:1.85rem; line-height:1.2;}
.bd .bn{font-size:.72rem; font-weight:700; margin-top:4px; line-height:1.25;}
.bd .bs{font-size:.64rem; color:var(--muted); line-height:1.3; margin-top:2px;}
.bd.off .bi{filter:grayscale(1); opacity:.35;}
.bd.off .bn{color:var(--muted);}
.segctl{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
.segctl button{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:9px 4px; font-weight:700; font-size:.82rem;}
.segctl button.on{border-color:var(--green); background:var(--greenp); color:var(--green2);}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line);}
.setrow:last-child{border-bottom:none;}
.switch{width:52px; height:30px; border-radius:99px; border:none; background:var(--line); position:relative; flex:none;}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on{background:var(--green);}
.switch.on::after{transform:translateX(22px);}

/* ---------- onboarding ---------- */
.onb{padding:36px 22px 190px; min-height:100%; text-align:center;}
.onb h1{font-size:1.75rem; margin:14px 0 10px; line-height:1.2;}
.onb .lead{font-size:1rem; color:var(--muted); margin:0 0 18px; text-align:left;}
.goalopt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow:0 3px 0 var(--line);}
.goalopt .ge{font-size:1.5rem;}
.goalopt .gt{font-weight:700;}
.goalopt .gs{font-size:.82rem; color:var(--muted);}
.goalopt .gx{margin-left:auto; font-weight:700; color:var(--muted); font-size:.9rem; white-space:nowrap;}
.goalopt.on{border-color:var(--green); background:var(--greenp); box-shadow:0 3px 0 var(--green);}
.goalopt.on .gx{color:var(--green2);}
.plan{list-style:none; padding:0; margin:0 0 16px; text-align:left;}
.plan li{display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px dashed var(--line); font-size:.94rem;}
.plan li span{width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:1.15rem; flex:none; background:var(--c);}

/* ---------- sheet / toast / confetti ---------- */
#sheet-root{position:fixed; inset:0; z-index:60; display:none;}
#sheet-root.open{display:block;}
.sheet-bg{position:absolute; inset:0; background:rgba(10,20,15,.45);}
.sheet{position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:100%; max-width:520px; background:var(--card); border-radius:24px 24px 0 0; padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out; text-align:center;}
.sheet::before{content:""; display:block; width:44px; height:5px; border-radius:9px; background:var(--line); margin:0 auto 14px;}
@keyframes up{from{transform:translate(-50%,40px); opacity:.4}}
.sheet .sh-i{font-size:2.4rem; line-height:1;}
.sheet h3{font-size:1.25rem; margin:10px 0 4px;}
.sheet .sh-s{color:var(--muted); font-size:.9rem; margin:0 0 18px;}
#toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 14px); transform:translate(-50%,-120px); z-index:70; background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:14px; font-weight:600; font-size:.9rem; transition:transform .3s ease; max-width:90%; text-align:center;}
#toast.show{transform:translate(-50%,0);}
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:80; display:none;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important;}
}
</style>

<script>
/* ===== Helpers de conteúdo (geram HTML para os cards de teoria) ===== */
function T(name, deb, cred, saldo){
  deb = deb || []; cred = cred || [];
  const rows = Math.max(deb.length, cred.length, 1);
  let d = '', c = '';
  for (let i = 0; i < rows; i++){
    d += '<div>' + (deb[i] !== undefined ? deb[i] : '&nbsp;') + '</div>';
    c += '<div>' + (cred[i] !== undefined ? cred[i] : '&nbsp;') + '</div>';
  }
  return '<div class="tacct"><div class="tname">' + name + '</div>' +
    '<div class="tdc"><span>Débito</span><span>Crédito</span></div>' +
    '<div class="tbody"><div class="tcol">' + d + '</div><div class="tcol">' + c + '</div></div>' +
    (saldo ? '<div class="tsaldo">' + saldo + '</div>' : '') + '</div>';
}
function TT(){ return '<div class="tgroup">' + Array.prototype.slice.call(arguments).join('') + '</div>'; }
function box(kind, html){
  const lbl = { dica:'💡 Dica', exemplo:'📌 Exemplo', atencao:'⚠️ Atenção', regra:'📏 Regra de ouro' }[kind];
  return '<div class="callout ' + kind + '"><div class="cl-h">' + lbl + '</div><div class="cl-b">' + html + '</div></div>';
}
function eq(html){ return '<div class="eqn">' + html + '</div>'; }
function tbl(head, rows){
  return '<div class="tblwrap"><table><thead><tr>' + head.map(function(x){ return '<th>' + x + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') +
    '</tbody></table></div>';
}
function lanc(lines){
  return '<div class="lanc">' + lines.map(function(l){
    return '<div class="ln ' + (l[0] === 'D' ? 'd' : 'c') + '"><span class="dc">' + l[0] + '</span><span class="acc">' + l[1] + '</span><span class="val">' + (l[2] || '') + '</span></div>';
  }).join('') + '</div>';
}
function ul(items){ return '<ul class="blist">' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ul>'; }
function ol(items){ return '<ol class="steps">' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ol>'; }
/* ======================= CONTEÚDO — PARTE 1 ======================= */
const COURSES = [];

/* ---------------- TRILHA 1 ---------------- */
COURSES.push({
  id:"base", title:"Primeiros Passos", icon:"🌱", color:"#1E8A4C",
  desc:"Para quem nunca estudou Contabilidade: o que ela é, o que é patrimônio e como se mede o lucro.",
  lessons:[
  {id:"base1", title:"Para que serve a Contabilidade", icon:"📒",
   learn:[
    {h:"Bem-vindo(a)! 👋", b:`<p>Contabilidade é a <b>linguagem dos negócios</b>. Ela registra tudo o que acontece com o dinheiro, os bens e as dívidas de uma empresa para que as pessoas tomem boas decisões.</p>` +
      box('exemplo', 'Dona Ana abriu uma padaria. Ela quer saber: estou ganhando dinheiro? Quanto devo aos fornecedores? Posso contratar mais alguém? A Contabilidade responde a todas essas perguntas.')},

/* Helpers compactos de exercício */
function mc(q, o, e, h){ const a = o.findIndex(s => s[0] === '*'); return { t:'mc', q:q, o:o.map(s => s.replace(/^\*/, '')), a:a, e:e, h:h }; }
function tf(q, a, e, h){ return { t:'tf', q:q, a:a, e:e, h:h }; }
function fl(q, extra, e, h){ const a = []; const qq = q.replace(/\{([^}]+)\}/g, function(_, w){ a.push(w); return '___'; }); return { t:'fill', q:qq, o:a.concat(extra), a:a, e:e, h:h }; }
function mt(pairs, e){ return { t:'match', pairs:pairs, e:e }; }
function en(q, d, c, extra, e, h){ d = d.split('+'); c = c.split('+'); return { t:'entry', q:q, d:d, c:c, accts:d.concat(c, extra), e:e, h:h }; }
function cl(q, cats, items, e){ return { t:'class', q:q, cats:cats, items:items.split('|').map(function(s){ const i = s.lastIndexOf(':'); return [s.slice(0, i), +s.slice(i + 1)]; }), e:e }; }
function nu(q, a, e, u, h, tol){ const o = { t:'num', q:q, a:a, e:e, h:h }; if (u === 'R$') o.u = 'R$'; else if (u) o.s = u; if (tol !== undefined) o.tol = tol; return o; }
function wr(q, a, e, h){ return { t:'wr', q:q, a:[].concat(a), e:e, h:h }; }
function ew(q, d, c, e, h){ return { t:'ew', q:q, d:d.split('+'), c:c.split('+'), e:e, h:h }; }
function od(q, items, e, h){ return { t:'ord', q:q, items:items, e:e, h:h }; }
function ep(q, model, k, e, min){ return { t:'expl', q:q, model:model, k:k, e:e, min:min }; }
function ts(name, deb, cred, e){ return { t:'tsal', name:name, deb:deb, cred:cred, e:e }; }

  {h:"Na Contabilidade", b:box('exemplo','Depreciação de R$ 12.000 por ano. Quanto em 5 meses? 12.000 ÷ 12 × 5 = <b>R$ 5.000</b>.') + `<p>Sempre que algo é distribuído no tempo (seguro, depreciação, 13º), aparece uma regra de três.</p>`},
  {h:"Rateio proporcional", b:`<p><b>Rateio</b> é dividir um valor entre partes de forma proporcional.</p>` + box('exemplo','Aluguel de R$ 3.000 dividido pela área: setor A tem 60 m² e setor B 40 m². A fica com 60% = R$ 1.800; B com 40% = R$ 1.200.')}
 ],
 ex:[
  nu("3 cadernos custam R$ 18. Quanto custam 7 cadernos?",42,"18 ÷ 3 = 6 por caderno; 6 × 7 = 42.","R$","Ache primeiro o preço de um."),
  nu("Um seguro anual de R$ 2.400 cobre 12 meses. Quanto corresponde a 1 mês?",200,"2.400 ÷ 12 = 200.","R$"),
  nu("Depreciação anual de R$ 6.000. Quanto em 4 meses?",2000,"6.000 ÷ 12 × 4 = 2.000.","R$","Descubra o valor de um mês."),
  nu("Aluguel de R$ 5.000 rateado por área: setor A tem 30 m² e setor B 70 m². Quanto fica para o setor A?",1500,"A tem 30% da área: 5.000 × 0,30 = 1.500.","R$","Qual a fatia de A no total de 100 m²?"),
  tf("Se 4 horas de trabalho custam R$ 100, 8 horas custam R$ 200.",true,"Proporção direta: dobra uma, dobra a outra."),
  mc("Na regra de três direta, depois de montar a tabela você:",["*Multiplica cruzado e isola o x","Soma todos os números","Divide tudo por 100","Subtrai os valores"],"Multiplicação cruzada: a × x = b × c."),
  fl("Dividir um custo entre setores de forma proporcional se chama {rateio}.",["estorno","saldo"],"O rateio aparece muito nos custos indiretos."),
  wr("Qual é o nome da técnica de multiplicar cruzado para achar um valor proporcional? (três palavras)",["regra de tres","regra de 3"],"Regra de três.")
 ]},
{id:"antes3", title:"Positivo, negativo e saldo", icon:"➕",
 learn:[
  {h:"Entrou e saiu", b:`<p>Pense na sua conta do banco: entradas somam, saídas subtraem. O resultado é o <b>saldo</b>.</p>` + tbl(['Movimento','Valor'],[['Saldo inicial','500'],['Salário','+ 2.000'],['Mercado','− 350'],['Conta de luz','− 150'],['<b>Saldo final</b>','<b>2.000</b>']])},
  {h:"Números negativos", b:`<p>Saldo negativo quer dizer que saiu mais do que entrou: você está devendo.</p>` + ul(['300 − 500 = <b>−200</b> (faltaram 200)','−200 é <b>menor</b> que −50']) + box('dica','Na Contabilidade, em vez de sinais, usamos lados: débito e crédito. Mas a lógica de somar e subtrair é a mesma.')},
  {h:"Parênteses nos relatórios", b:`<p>Em relatórios contábeis, número entre parênteses é <b>negativo</b> ou dedução.</p>` + tbl(['Linha','R$'],[['Receita','50.000'],['(−) Despesas','(35.000)'],['Resultado','15.000']])}
 ],
 ex:[
  nu("Saldo inicial de R$ 1.200, entrada de R$ 800 e saída de R$ 1.500. Qual o saldo final?",500,"1.200 + 800 − 1.500 = 500.","R$"),
  nu("Você tinha R$ 300 e pagou uma conta de R$ 450 usando o limite. Qual o saldo? (use o sinal de menos)",-150,"300 − 450 = −150. O sinal de menos indica dívida.","R$","Faça 300 − 450."),
  mc("Em um relatório contábil, o que significa (4.500)?",["*Um valor negativo de 4.500","Um valor positivo de 4.500","Um valor aproximado","Um valor em dólar"],"Parênteses indicam valor negativo ou dedução."),
  tf("−300 é maior que −100.",false,"Quanto mais à esquerda na reta, menor: −300 < −100."),
  od("Coloque em ordem, do menor para o maior:",["−500","−20","0","35","1.000"],"Negativos com número maior são menores."),
  nu("Lucro de R$ 2.000 em janeiro e prejuízo de R$ 3.500 em fevereiro. Qual o resultado acumulado?",-1500,"2.000 − 3.500 = −1.500 (prejuízo acumulado).","R$"),
  wr("Como se chama a diferença entre tudo o que entrou e tudo o que saiu de uma conta?",["saldo"],"Saldo = entradas − saídas.")
 ]},
{id:"antes4", title:"Juros simples e compostos", icon:"📈",
 learn:[
  {h:"O que são juros", b:`<p>Juros são o <b>preço do dinheiro no tempo</b>. Quem empresta recebe juros; quem pega emprestado paga.</p>` + tbl(['Termo','Significado'],[['Capital (C)','Valor inicial'],['Taxa (i)','Percentual por período'],['Tempo (t)','Número de períodos'],['Montante (M)','Capital + juros']])},
  {h:"Juros simples", b:eq('J = C × i × t') + box('exemplo','R$ 1.000 a 2% ao mês por 3 meses: 1.000 × 0,02 × 3 = <b>R$ 60</b>. Montante: R$ 1.060.')},
  {h:"Juros compostos", b:`<p>Juros sobre juros: a cada mês a taxa incide sobre o montante anterior.</p>` + eq('M = C × (1 + i)<sup>t</sup>') + tbl(['Mês','Montante a 2%'],[['0','1.000,00'],['1','1.020,00'],['2','1.040,40'],['3','1.061,21']])},
  {h:"Por que importa", b:`<p>Empréstimos, financiamentos, cartão de crédito e aplicações usam juros compostos. Na empresa, juros pagos são <b>despesa financeira</b> e juros recebidos são <b>receita financeira</b>.</p>` + box('atencao','O rotativo do cartão de crédito está entre as taxas mais altas do mercado.')}
 ],
 ex:[
  nu("Juros simples: R$ 2.000 a 3% ao mês por 4 meses. Quanto de juros?",240,"2.000 × 0,03 × 4 = 240.","R$","J = C × i × t."),
  nu("Qual o montante do exemplo anterior (capital + juros)?",2240,"2.000 + 240 = 2.240.","R$"),
  nu("Juros compostos: R$ 1.000 a 10% ao mês por 2 meses. Qual o montante?",1210,"1.000 × 1,1 = 1.100; 1.100 × 1,1 = 1.210.","R$","Aplique 10% duas vezes seguidas."),
  mc("Em juros compostos, a taxa incide sobre:",["*O montante acumulado até o período anterior","Sempre o capital inicial","Apenas os juros","Nada"],"É o famoso juros sobre juros."),
  tf("Com mesma taxa e prazo maior que um período, juros compostos rendem mais que juros simples.",true,"Os juros também passam a render juros."),
  mt([["Capital","Valor inicial"],["Taxa","Percentual por período"],["Montante","Capital + juros"],["Juros","Preço do dinheiro no tempo"]],"Vocabulário básico de matemática financeira."),
  mc("Para uma empresa que pegou empréstimo, os juros pagos são:",["*Despesa financeira","Receita financeira","Capital social","Ativo"],"Juros pagos reduzem o resultado."),
  wr("Como se chama o capital somado aos juros?",["montante"],"Montante = capital + juros.")
 ]},
{id:"antes5", title:"O que é uma empresa", icon:"🏪",
 learn:[
  {h:"Empresa e sócios", b:`<p>Empresa é uma organização que produz ou vende algo buscando <b>lucro</b>. Quem investe nela são os <b>sócios</b> (ou o empresário individual).</p>`},
  {h:"Formatos comuns no Brasil", b:tbl(['Tipo','Resumo'],[['MEI','Microempreendedor individual, faturamento de até R$ 81 mil por ano'],['SLU','Sociedade limitada com um único sócio'],['LTDA','Sociedade limitada: sócios respondem até o valor do capital'],['S.A.','Capital dividido em ações']])},
  {h:"CNPJ", b:`<p>O CNPJ é como o “CPF da empresa”: o número de cadastro na Receita Federal. Com ele a empresa emite notas, abre conta e paga tributos.</p>` + box('regra','CPF (pessoa) e CNPJ (empresa) são pessoas diferentes. O dinheiro de um não se mistura com o do outro.')},
  {h:"Comércio, indústria e serviços", b:ul(['<b>Comércio</b>: compra e revende (loja, mercado).','<b>Indústria</b>: transforma matéria-prima (fábrica).','<b>Serviços</b>: vende trabalho (salão, oficina, contador).'])}
 ],
 ex:[
  cl("Que tipo de atividade é?",["Comércio","Indústria","Serviços"],"Loja de roupas:0|Fábrica de móveis:1|Salão de beleza:2|Mercadinho:0|Escritório de contabilidade:2|Fábrica de sorvetes:1","Comércio revende; indústria transforma; serviços vende trabalho."),
  mc("O que é o CNPJ?",["*O cadastro da empresa na Receita Federal","O CPF do dono","Um tipo de imposto","Um livro contábil"],"Cadastro Nacional da Pessoa Jurídica."),
  tf("O MEI pode faturar até R$ 81 mil por ano.",true,"Esse é o limite anual do MEI."),
  mt([["MEI","Até R$ 81 mil por ano"],["LTDA","Sócios respondem até o capital"],["S.A.","Capital dividido em ações"],["SLU","Limitada com um só sócio"]],"Principais formatos de empresa."),
  wr("Qual a sigla do cadastro que funciona como o “CPF da empresa”?",["cnpj"],"CNPJ."),
  mc("Quem transforma matéria-prima em produto é uma empresa de:",["*Indústria","Comércio","Serviços","Governo"],"A indústria fabrica; o comércio revende."),
  ep("Com suas palavras: por que o dinheiro da empresa deve ficar separado do dinheiro do dono?","Porque a empresa é uma entidade separada do dono. Misturar os dois bagunça os números e impede saber se a empresa realmente dá lucro.",[["A empresa é separada do dono","separ","entidade","distint","diferent","nao mistur","outra pessoa","propri"],["Misturar distorce os números e o lucro","numer","controle","saber","lucro","resultado","informac","distorc","bagunc","errad","confus","prejuiz","conta"]],"Essa é a ideia de Entidade: patrimônio da empresa ≠ patrimônio do sócio.")
 ]},
{id:"antes6", title:"À vista, a prazo e parcelado", icon:"💳",
 learn:[
  {h:"À vista", b:`<p>Pagamento <b>na hora</b>: dinheiro, Pix, cartão de débito. Na Contabilidade, mexe direto no Caixa ou no Banco.</p>`},

  {h:"Parcelado e cartão de crédito", b:`<p>Parcelado é a prazo dividido em partes. Numa venda no cartão de crédito, a loja recebe da operadora <b>depois</b>: até lá, é um valor a receber.</p>` + box('exemplo','R$ 1.000 a prazo ou R$ 950 à vista: desconto de 5% para pagar na hora.')}
 ],

 ]},
{id:"antes7", title:"Nota fiscal, boleto e recibo", icon:"🧾",

 ]},
{id:"antes8", title:"Caixa, banco e Pix", icon:"🏦",
 learn:[
  {h:"Caixa", b:`<p>Dinheiro em espécie guardado na empresa (gaveta, cofre). A conta se chama <b>Caixa</b>.</p>`},
  {h:"Bancos", b:`<p>Dinheiro em conta corrente. A conta se chama <b>Bancos</b> (ou Bancos conta movimento). Pix, TED e boletos passam por aqui.</p>` + box('dica','Pix recebido = dinheiro entrando no banco na hora.')},
  {h:"Aplicações e disponível", b:`<p>Dinheiro investido (CDB, fundos) rende juros: <b>Aplicações financeiras</b>.</p>` + eq('Disponível = Caixa + Bancos + aplicações de liquidez imediata') + `<p>Mover dinheiro entre elas não muda o total: depositar o caixa no banco é só uma troca de lugar.</p>`}
 ],

  en("A empresa deposita R$ 1.000 do caixa na conta bancária.","Bancos","Caixa",["Capital social","Receita de vendas"],"Bancos aumenta e Caixa diminui.","Uma conta de Ativo sobe e outra desce."),
  tf("Depositar dinheiro do caixa no banco aumenta o total disponível.",false,"É só uma troca entre contas do Ativo."),
  cl("Onde fica cada valor?",["Caixa","Bancos","Aplicações"],"Dinheiro na gaveta:0|Saldo da conta corrente:1|CDB de liquidez diária:2|Pix recebido:1|Troco no cofre:0","Espécie é Caixa; conta corrente é Bancos; investimento é Aplicação."),
  mc("O que forma o “Disponível” da empresa?",["*Caixa, bancos e aplicações de liquidez imediata","Estoques e máquinas","Fornecedores","Capital social"],"É o dinheiro que pode ser usado agora."),
  wr("Qual conta registra o dinheiro em espécie guardado na empresa?",["caixa"],"Caixa = dinheiro físico."),

 ]},

{id:"dc5", title:"Erros e estornos", icon:"↩️",
 learn:[
  {h:"Todo mundo erra", b:`<p>Lançou na conta errada ou com o valor errado? Na Contabilidade <b>não se apaga</b>: faz-se um estorno e depois o lançamento correto.</p>` + box('atencao','Rasurar ou apagar registros não é permitido: a contabilidade precisa deixar rastro.')},

 ],

  en("Estorne o lançamento feito por engano: D Despesa de aluguel / C Caixa, R$ 500.","Caixa","Despesa de aluguel",["Despesa com energia","Bancos"],"O estorno inverte débito e crédito.","Inverta os lados do lançamento original."),

 ]},

(function buildCourses(){
  const pool = {}, old = {};
  COURSES.forEach(c => { old[c.id] = c; c.lessons.forEach(l => pool[l.id] = l); });
  NEW_LESSONS.forEach(l => pool[l.id] = l);
  Object.keys(EXTRA).forEach(id => { pool[id].ex = pool[id].ex.concat(EXTRA[id]); });
  const built = LAYOUT.map(L => {
    const o = old[L.id] || {};
    const c = { id:L.id, title:L.title || o.title, icon:L.icon || o.icon, color:L.color || o.color, desc:L.desc || o.desc };
    c.units = L.units.map(u => ({ t:u[0], lessons:u[1].map(id => pool[id]) }));
    c.lessons = [].concat.apply([], c.units.map(u => u.lessons));

  });

})();

function dayDiff(a, b){ return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000); }

function parseBR(s){
  s = String(s).trim().replace(/R\$|%|\s|vezes|dias|unidades/gi, '').replace(/[−–]/g, '-');
  if (!s) return NaN;
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return Number(s);
}
function seeded(str){
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return function(){ h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
}

/* ---------- corretor local (sem custo) ---------- */
function normTxt(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/º|°/g, '').replace(/-/g, '')
    .replace(/[^a-z0-9/%\s]/g, ' ').replace(/\s+/g, ' ').trim();
}
const STOP = new Set(['o','a','os','as','de','da','do','das','dos','um','uma','e','em','com','para','por','no','na','nos','nas']);
function normAns(s){
  const words = normTxt(s).split(' ').filter(Boolean);
  const kept = words.filter(w => !STOP.has(w));
  return (kept.length ? kept : words).map(w => (w.length > 3 && w.endsWith('s')) ? w.slice(0, -1) : w).join(' ');
}
function lev(a, b){
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length:n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
/* 2 = exato, 1 = pequeno erro de digitação, 0 = diferente */
function fuzzyEq(input, target){
  const a = normAns(input), b = normAns(target);
  if (!a) return 0; if (a === b) return 2;
  const tol = b.length <= 4 ? 0 : b.length <= 9 ? 1 : 2;
  return lev(a, b) <= tol ? 1 : 0;
}
function bestMatch(input, list){ let best = 0; list.forEach(t => { best = Math.max(best, fuzzyEq(input, t)); }); return best; }
function acctMatch(input, canon){ return bestMatch(input, [canon].concat(ALIASES[canon] || [])); }
function evalExpl(text, x){
  const t = ' ' + normTxt(text) + ' ', words = t.trim().split(' ');
  const hits = x.k.map(g => g.slice(1).some(st => {
    const s = normTxt(st); if (!s) return false;
    if (s.indexOf(' ') >= 0) return t.indexOf(' ' + s) >= 0;
    return words.some(w => w.indexOf(s) === 0);
  }));
  const n = hits.filter(Boolean).length, need = x.min || Math.max(1, Math.ceil(x.k.length * 0.6));
  return { hits:hits, ok:n >= need, n:n, need:need };
}

  Object.keys(s).forEach(k => {

    if (s[k] !== null && typeof s[k] === 'object'){ if (typeof v === 'object' && !Array.isArray(v)) s[k] = Object.assign({}, s[k], v); }

let saveTimer = null, saving = false, saveAgain = false;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 500); }
async function flush(){
  if (saving){ saveAgain = true; return; }
  saving = true;
  const cut = new Date(); cut.setDate(cut.getDate() - 60); const ck = today(cut);
  Object.keys(S.days).forEach(k => { if (k < ck) delete S.days[k]; });
  const payload = JSON.parse(JSON.stringify(S));
  try { localStorage.setItem(LS_KEY, JSON.stringify(payload)); } catch (e) {}

    try { await cloud.ref.set(payload); }
    catch (e){ if (e && ['invalid_argument','revoked','not_granted'].indexOf(e.code) >= 0) cloud.ref = null; }

function curStreak(){
  if (!S.lastActive) return 0;
  const d = dayDiff(S.lastActive, today());
  if (d <= 1) return S.streak;
  return (d - 1 <= S.freezes) ? S.streak : 0;
}
function studiedToday(){ return S.lastActive === today(); }
function registerActivity(){
  const t = today(); if (S.lastActive === t) return;
  const diff = S.lastActive ? dayDiff(S.lastActive, t) : 99;
  if (diff === 1) S.streak++;
  else if (diff > 1 && diff < 99 && diff - 1 <= S.freezes){ S.freezes -= (diff - 1); S.usedFreeze += (diff - 1); S.streak++; toast('🛡️ Sua represa protegeu a sequência!'); }
  else S.streak = 1;
  S.lastActive = t;
}

    case 'ord': return x.items.join(' → ');
    case 'tsal': return tsalAnswer(x);
    case 'expl': return x.model;
    case 'class': return 'Veja as correções destacadas acima.';
    default: return '';
  }
}

/* ---------- SESSÃO DE EXERCÍCIOS ---------- */
let SES = null, R = null;
const PRAISE = ['Muito bem!', 'Isso aí!', 'Correto!', 'Mandou bem!', 'Perfeito!', 'Exato!', 'Excelente!', 'Show de bola!'];
function startLessonQuiz(l){ startSession({ kind:'lesson', lesson:l, course:l.course, items:l.ex.map(x => ({ key:x.key, x:x })), hearts:5 }); }
function startFinal(c){
  const pool = []; c.lessons.forEach(l => l.ex.forEach(x => { if (['expl'].indexOf(x.t) < 0) pool.push({ key:x.key, x:x }); }));
  startSession({ kind:'final', course:c, items:shuffle(pool).slice(0, 10), hearts:3 });
}
function startSession(o){
  SES = Object.assign({ queue:o.items.slice(), total:o.items.length, done:0, first:0, combo:0, maxCombo:0, wrong:{}, phase:'answer', maxHearts:o.hearts, usedHint:false }, o);
  go('quiz'); renderItem();
}
function setBtn(txt, dis){ const b = $('#q-btn'); b.textContent = txt; b.disabled = !!dis; }
function bentoQuiz(mood){ const w = $('#q-bento'); if (w) w.innerHTML = bento(mood); }
function renderItem(){
  const it = SES.queue[0], x = it.x, body = $('#q-body'), foot = $('#q-foot');
  SES.phase = 'answer'; foot.className = 'foot';
  $('#q-hearts').innerHTML = SES.maxHearts >= 99 ? '∞' : '<span class="hi">❤️</span>' + SES.hearts;
  $('#q-bar').style.width = (SES.done / SES.total * 100) + '%';
  body.innerHTML = '';
  bentoQuiz('idle');
  const retry = !!SES.wrong[it.key];
  body.appendChild(el('div', 'qk', (SAY.quiz[x.t] || 'Responda:') + (retry ? ' <span class="tagnew">Tente de novo</span>' : '')));
  const mountEl = el('div'); body.appendChild(mountEl);
  const startedHint = S.st.hints;
  R = render(x, mountEl, () => { if (SES.phase === 'answer') $('#q-btn').disabled = !R.ready(); }, () => { if (SES.phase === 'answer') resolve(true); });
  if (S.st.hints > startedHint) SES.usedHint = true;
  setBtn(R.auto ? 'Forme todos os pares' : 'Verificar', true);
  window.scrollTo(0, 0);
}
function primary(){
  if (!SES) return;
  if (SES.phase === 'answer'){ if (!R.ready()) return; const ok = R.check(); resolve(ok); }
  else nextItem();
}
function resolve(ok){
  const it = SES.queue[0], x = it.x;
  SES.phase = 'feedback'; R.reveal(ok);
  if (S.st.hints > (SES._h0 || 0)) SES.usedHint = true;
  if (ok){
    SES.done++;
    const clean = !SES.wrong[it.key] && !SES.usedHint && !(R.imperfect && R.imperfect());
    if (clean){ SES.first++; if (S.mistakes[it.key]) delete S.mistakes[it.key]; }
    else if (R.imperfect && R.imperfect()) S.mistakes[it.key] = (S.mistakes[it.key] || 0) + 1;
    SES.combo++; SES.maxCombo = Math.max(SES.maxCombo, SES.combo); mprog('combo', SES.combo);
    if (x.t === 'entry' || x.t === 'ew'){ S.st.entries++; mprog('entries', 1); }
    if (x.t === 'wr' || x.t === 'ew' || x.t === 'expl'){ S.st.writes++; mprog('writes', 1); }
    SES.queue.shift(); sfx.ok(); bentoQuiz('happy');
  } else {
    SES.hearts--; SES.wrong[it.key] = true;
    S.mistakes[it.key] = (S.mistakes[it.key] || 0) + 1;
    SES.combo = 0; SES.queue.push(SES.queue.shift()); sfx.bad(); buzz(); bentoQuiz('sad');
  }
  $('#q-hearts').innerHTML = SES.maxHearts >= 99 ? '∞' : '<span class="hi">❤️</span>' + SES.hearts;
  $('#q-bar').style.width = (SES.done / SES.total * 100) + '%';
  const foot = $('#q-foot'); foot.className = 'foot ' + (ok ? 'ok' : 'bad');
  let title = ok ? '✅ ' + pick(PRAISE) : '❌ ' + pick(SAY.bad);
  if (ok && [3, 5, 8, 12].indexOf(SES.combo) >= 0) title = '🔥 ' + SES.combo + ' seguidas! ' + pick(PRAISE);
  $('#fb-t').innerHTML = title;
  $('#fb-b').innerHTML = (ok ? '' : '<div class="fb-ans">Resposta: ' + answerText(x) + '</div>') + x.e + (!ok && SES.hearts > 0 && SES.hearts < 90 ? '<div class="small muted" style="margin-top:6px">Esta questão volta no final.</div>' : '');
  setBtn('Continuar', false);
  save();
}
function nextItem(){
  if (SES.hearts <= 0) return failScreen();
  if (!SES.queue.length) return finish();
  renderItem();
}
function quitQuiz(){
  sheet('<div class="sh-i">🤔</div><h3>Sair agora?</h3><p class="sh-s">O progresso desta sessão será perdido. Os erros já registrados continuam na sua revisão.</p>' +
    '<button class="btn primary" data-s="stay">Continuar estudando</button><button class="btn ghost" data-s="quit">Sair</button>',
    { quit: () => { const s = SES; SES = null; exitTo(s); } });
}
function exitTo(s){
  if (s && s.course && (s.kind === 'lesson' || s.kind === 'final')) openPath(s.course);
  else { renderPractice(); go('practice'); }
}
function finish(){
  const s = SES, perfect = s.first === s.total, before = S.days[today()] || 0, lvBefore = levelInfo(S.xp).n;
  let xp = 0, coins = 0, title = '', sub = '', emoji = '🎉', mood = 'cheer', extra = [], caseHtml = '';

    const firstTime = !S.done[s.lesson.id];

    S.done[s.lesson.id] = true; if (perfect && !s.usedHint) S.perfect[s.lesson.id] = true; S.lessons++;
    mprog('lessons', 1); if (!s.usedHint) mprog('nohint', 1); if (perfect) mprog('perfect', 1);

    if (firstTime && courseComplete(s.course)) extra.push(['🏁', 'Você concluiu todas as lições de “' + s.course.title + '”. O teste final está liberado!']);
  } else if (s.kind === 'final'){

    title = 'Troféu conquistado!'; sub = s.course.title; emoji = '🏆';
    const nx = COURSES[s.course.idx + 1];
    if (firstT && nx) extra.push(['🔓', 'Próxima trilha liberada: ' + nx.title]);
  } else if (s.kind === 'case'){

  }
  addXP(xp); addCoins(coins); registerActivity();
  const after = S.days[today()] || 0;
  if (before < S.goal && after >= S.goal) extra.push(['🎯', 'Meta diária de ' + S.goal + ' XP batida!']);
  const lvAfter = levelInfo(S.xp); if (lvAfter.n > lvBefore) extra.push(['⬆️', 'Novo nível: ' + lvAfter.name]);
  checkBadges().forEach(b => extra.push([b.i, 'Conquista desbloqueada: ' + b.n]));
  save(); renderTop();
  const cc = s.course ? s.course.color : (s.caseObj ? s.caseObj.color : 'var(--ink)');
  const scr = $('#s-result');

function caseBalanceteHTML(cs){
  const bal = {};
  cs.ev.forEach(e => { e[1].forEach(p => { bal[p[0]] = (bal[p[0]] || 0) + p[1]; }); e[2].forEach(p => { bal[p[0]] = (bal[p[0]] || 0) - p[1]; }); });
  const g = { AC:[], ANC:[], PC:[], PNC:[], PL:[], REC:[], DESP:[] };
  Object.keys(bal).forEach(a => { const grp = CHART[a]; if (grp && Math.abs(bal[a]) > 0.004) g[grp].push([a, bal[a]]); });
  const ativo = g.AC.concat(g.ANC), passivo = g.PC.concat(g.PNC);
  const ativoT = ativo.reduce((a, x) => a + x[1], 0);
  const passivoT = passivo.reduce((a, x) => a - x[1], 0);
  const plBase = g.PL.reduce((a, x) => a - x[1], 0);
  const receitaT = g.REC.reduce((a, x) => a - x[1], 0), despesaT = g.DESP.reduce((a, x) => a + x[1], 0);
  const lucro = receitaT - despesaT, plT = plBase + lucro;
  const rows = []; const maxN = Math.max(ativo.length, passivo.length + 2);
  for (let i = 0; i < maxN; i++){
    const L = ativo[i] ? [ativo[i][0], fmt(ativo[i][1])] : ['', ''];
    let Rn = '', Rv = '';
    if (i < passivo.length){ Rn = passivo[i][0]; Rv = fmt(passivo[i][1]); }
    else if (i === passivo.length) { Rn = 'Capital social e reservas'; Rv = fmt(plBase); }
    else if (i === passivo.length + 1) { Rn = 'Lucro do período'; Rv = fmt(lucro); }
    rows.push([L[0], L[1], Rn, Rv]);
  }
  rows.push(['<b>Total do Ativo</b>', '<b>' + fmt(ativoT) + '</b>', '<b>Total</b>', '<b>' + fmt(passivoT + plT) + '</b>']);
  return '<div class="card" style="margin-top:14px;text-align:left"><div class="sec-h" style="margin:0 0 10px">📒 Balanço da sua empresa</div>' + tbl(['Ativo', 'R$', 'Passivo e PL', 'R$'], rows) +
    '<div class="small muted" style="padding:0 2px 2px">Receitas de R$ ' + fmt(receitaT) + ' menos despesas de R$ ' + fmt(despesaT) + ' = lucro de R$ ' + fmt(lucro) + '. Seus lançamentos fecharam certinho: Ativo = Passivo + PL!</div></div>';
}

function randomEntryItem(){

  } else {
    h = '<h1>Seu caminho</h1><p class="lead">Vamos do zero absoluto até auditoria, passando pelas contas do dia a dia. Cada trilha libera a próxima:</p><ul class="plan">' +
      COURSES.map(c => '<li><span style="--c:' + c.color + '33">' + c.icon + '</span><div><b>' + c.title + '</b><div class="small muted">' + c.lessons.length + ' lições</div></div></li>').join('') + '</ul>';
    btns = '<button class="btn primary" data-act="start">Fazer a primeira lição</button><button class="btn ghost" data-act="home">Ver as trilhas primeiro</button>';
  }
  s.innerHTML = '<div class="onb">' + h + '</div><div class="foot">' + btns + '</div>';
  bindActs(s, {
    n: () => { ONB.step++; renderOnb(); window.scrollTo(0, 0); },
    b: () => { ONB.step--; renderOnb(); },
    g: b => { ONB.goal = +b.dataset.g; sfx.tap(); renderOnb(); },
    start: () => { finishOnb(); openLesson(COURSES[0].lessons[0]); },
    home: () => { finishOnb(); renderHome(); go('home'); }
  });
}
function finishOnb(){ S.goal = ONB.goal; S.onboarded = true; save(); renderTop(); }

/* ---------- eventos globais ---------- */
$('#q-btn').addEventListener('click', primary);
$('#q-close').addEventListener('click', quitQuiz);
$$('#bottomnav button').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.tab; sfx.tap();
  if (t === 'home') renderHome();
  if (t === 'practice') renderPractice();
  if (t === 'shop') renderShop();
  if (t === 'glossary') renderGlossary($('#g-search').value);
  if (t === 'profile') renderProfile();
  go(t);
}));
$('#g-search').addEventListener('input', e => renderGlossary(e.target.value));
document.addEventListener('keydown', e => {
  if ($('#sheet-root').classList.contains('open')){ if (e.key === 'Escape') closeSheet(); return; }
  if (CUR !== 'quiz' || !SES) return;
  if (e.key === 'Enter'){ e.preventDefault(); if (!$('#q-btn').disabled) primary(); return; }
  if (SES.phase === 'answer' && R && R.key && /^[1-9]$/.test(e.key) && document.activeElement.tagName !== 'INPUT') R.key(+e.key);
});

/* ---------- início ---------- */
function route(){ applyTheme(); renderTop(); if (!S.onboarded){ ONB = { step:0, goal:S.goal || 30 }; renderOnb(); go('onb'); } else { renderHome(); go('home'); } }
(async function boot(){
  S = loadLocal(); route();
  try {
    await initCloud();
    if (!cloud.ref) return;
    const snap = await cloud.ref.get();
    if (snap.exists){
      const cs = normalize(snap.data());
      if (cs.xp > S.xp || (cs.xp === S.xp && cs.onboarded && !S.onboarded)){
        S = cs; try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
        if (['home', 'onb', 'practice', 'profile', 'glossary', 'path', 'shop'].indexOf(CUR) >= 0) route();
      } else if (S.xp > cs.xp || S.onboarded !== cs.onboarded) flush();
    } else if (S.xp > 0 || S.onboarded) flush();
  } catch (e) {}
})();

</script>
