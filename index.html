<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ContaTrilha — Contabilidade do zero</title>
<meta name="description" content="Aprenda contabilidade do zero, no ritmo de um jogo: trilhas, exercícios e revisão automática dos seus erros.">
<meta name="theme-color" content="#58CC02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ContaTrilha">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=Roboto+Slab:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/main.css">
<link rel="stylesheet" href="/src/styles/learning.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="brand" id="area-switch" type="button" aria-label="Escolher área de estudo"><img class="mark" src="/images/bento-face.png" alt=""><span>ContaTrilha</span><span id="area-switch-icon" class="brand-area" aria-hidden="true">📘</span><span class="brand-chevron" aria-hidden="true">⌄</span></button>
    <div class="stats">
      <div class="pill fire" id="pill-streak" title="Dias seguidos"><span>0</span>🔥</div>
      <div class="pill xp" id="pill-xp" title="XP"><span>0</span><i class="xpl">XP</i></div>
      <div class="pill" id="pill-coins" title="Bolotas"><span>0</span></div>
      <button class="pwa-install" id="pwa-install" type="button" hidden>Instalar</button>
    </div>
  </header>
  <main>
    <section class="screen" id="s-onb"></section>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-areas"></section>
    <section class="screen" id="s-path"></section>
    <section class="screen" id="s-learn"></section>
    <section class="screen" id="s-quiz">
      <div class="qtop">
        <button class="icon-btn" id="q-close" aria-label="Sair da lição">✕</button>
        <div class="qbar"><div id="q-bar" style="width:0%"></div></div>
        <div id="q-hearts"><span class="hi">❤️</span>5</div>
        <div class="bento-wrap xs" id="q-bento"></div>
      </div>
      <div class="qbody" id="q-body"></div>
      <div class="foot" id="q-foot">
        <div class="fb"><div class="fb-t" id="fb-t"></div><div class="fb-b" id="fb-b"></div></div>
        <button class="btn primary" id="q-btn" disabled>Verificar</button>
      </div>
    </section>
    <section class="screen" id="s-result"></section>
    <section class="screen" id="s-fail"></section>
    <section class="screen" id="s-blitz"></section>
    <section class="screen" id="s-practice"></section>
    <section class="screen" id="s-shop"></section>
    <section class="screen" id="s-glossary">
      <div class="search"><input id="g-search" type="search" placeholder="Buscar termo, ex: depreciação" aria-label="Buscar no glossário"></div>
      <dl class="gl" id="g-list"></dl>
    </section>
    <section class="screen" id="s-profile"></section>
  </main>
  <nav id="bottomnav" hidden>
    <button data-tab="home"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg></span>Aprender</button>
    <button data-tab="practice"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9v6M3 10v4m15-5v6m3-5v4M6 12h12"/></svg></span>Praticar</button>
    <button data-tab="shop"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h16l-1 12H5L4 8Zm4 0a4 4 0 0 1 8 0"/></svg></span>Loja</button>
    <button data-tab="glossary"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 1 4 17.5zM4 16h16"/></svg></span>Glossário</button>
    <button data-tab="profile"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Perfil</button>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti"></canvas>
<script type="module" src="/src/main.js"></script>
</body>
</html>
